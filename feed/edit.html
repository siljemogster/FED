<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Post | Loop</title>
    <link rel="stylesheet" href="../css/output.css" />
    <script src="/js/app.js" type="module"></script>
    <style>
      /* Ensure hidden class works correctly */
      .hidden {
        display: none !important;
      }
      
      /* Responsive design adjustments */
      @media (max-width: 640px) {
        main {
          padding-left: 1rem;
          padding-right: 1rem;
        }
        
        input, textarea {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="flex flex-col min-h-screen">
    <header>
      <nav class="bg-white border-b border-gray-200 fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16 items-center">
            <div class="flex-shrink-0 flex items-center">
              <a
                href="/"
                class="text-2xl font-bold tracking-tight text-purple-700 transition-colors"
              >
                Loop
              </a>
            </div>
            
          </div>
        </div>
      </nav>
    </header>
    <main class="max-w-2xl mx-auto p-4 mt-20 flex-grow">
      <div class="bg-white p-6 rounded-lg shadow-sm">
        <h1 class="text-2xl font-bold mb-6">Edit Post</h1>
        
        <form>
          <div class="mb-4">
            <label for="post-title" class="block text-sm font-medium text-gray-700 mb-1">
              Post Title
            </label>
            <input
              type="text"
              id="post-title"
              name="post-title"
              class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent"
              value="My Latest Design Project"
              required
            />
          </div>
          
          <div class="mb-4">
            <label for="post-content" class="block text-sm font-medium text-gray-700 mb-1">
              Post Content
            </label>
            <textarea
              id="post-content"
              name="post-content"
              rows="6"
              class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent"
              required
            >Just finished my latest UI design project! Here's a sneak peek of the interface I've been working on. The goal was to create a clean, intuitive design that improves user experience. 🎨 #DesignThinking #UI</textarea>
          </div>
          
          <div class="mb-6">
            <p class="block text-sm font-medium text-gray-700 mb-1">
              Post Image
            </p>
            <div class="flex items-center">
              <img
                src="https://ui-avatars.com/api/?name=Design+Project&background=random"
                alt="Current post image"
                class="w-24 h-24 object-cover rounded-md mr-4"
              />
              <div>
                <label for="post-image" class="cursor-pointer px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors">
                  Change Image
                  <input type="file" id="post-image" name="post-image" class="hidden" accept="image/*" />
                </label>
                <p class="text-xs text-gray-500 mt-1">Recommended size: 1200x630 pixels</p>
              </div>
            </div>
          </div>
          
          <div class="flex justify-between">
            <button
              type="button"
              class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors"
              onclick="history.back()"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-6 py-2 bg-purple-700 text-white rounded-md hover:bg-purple-600 transition-colors"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer class="bg-gray-70 border-t border-gray-200 py-7 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col items-center space-y-4">
          <div class="text-gray-400 text-sm">
            <span class="font-medium">Loop</span> &copy; 2024
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
