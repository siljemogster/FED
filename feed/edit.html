<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit post | Loop</title>
    <link rel="stylesheet" href="../css/output.css" />
    <script src="/js/app.js" type="module"></script>
    <style>
      /* Ensure hidden class works correctly */
      .hidden {
        display: none !important;
      }
      
      /* Only show mobile menu button on small screens */
      @media (min-width: 640px) {
        #mobile-menu-button {
          display: none !important;
        }
      }
      
      @media (max-width: 640px) {
        /* Mobile adjustments */
        main {
          padding-left: 1rem;
          padding-right: 1rem;
        }
        
        /* Show hamburger button on mobile */
        #mobile-menu-button {
          display: inline-flex !important;
        }
        
        /* Form styling improvements for mobile */
        input, textarea {
          width: 100%;
        }
        
        /* Button container for better positioning */
        .button-container {
          display: flex;
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body class="flex flex-col min-h-screen">
    <header>
      <nav class="bg-white border-b border-gray-200 fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16">
            <div class="flex-shrink-0 flex items-center">
              <a
                href="/"
                class="text-2xl font-bold tracking-tight text-purple-700 transition-colors"
              >
                Loop
              </a>
            </div>
            <div class="hidden sm:flex sm:items-center sm:space-x-8">
              <a
                href="/profile"
                class="text-gray-700 hover:text-purple-700 px-3 py-2 text-sm font-medium transition-colors"
              >
                Profile
              </a>
              <a href="/feed" class="text-purple-700 text-sm font-medium">
                Feed
              </a>
              <button
                href="/"
                class="text-gray-700 hover:text-purple-700 px-3 py-2 text-sm font-medium transition-colors"
              >
                Sign Out
              </button>
            </div>
            <button
              type="button"
              id="mobile-menu-button"
              class="inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-purple-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-purple-500"
              aria-controls="mobile-menu"
              aria-expanded="false"
            >
              <span class="sr-only">Open main menu</span>
              <svg
                class="block h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="hidden" id="mobile-menu">
          <div class="pt-2 pb-3 space-y-1">
            <a
              href="/profile"
              class="text-gray-700 hover:text-purple-700 hover:bg-gray-50 block px-6 py-2 text-base font-medium transition-colors"
            >
              Profile
            </a>
            <a
              href="/feed"
              class="text-purple-700 hover:bg-gray-50 block px-6 py-2 text-base font-medium transition-colors"
            >
              Feed
            </a>
            <button
              href="/"
              class="text-gray-700 hover:text-purple-700 hover:bg-gray-50 block px-6 py-2 text-base font-medium transition-colors"
            >
              Sign Out
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main class="max-w-2xl mx-auto p-4 mt-20 flex-grow">
      <div class="bg-white p-6 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">Edit Post</h2>
        <form class="space-y-4" id="editPostForm">
          <input type="hidden" name="id" />
          <input 
            name="title" 
            placeholder="Title" 
            required 
            class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700"
          />
          <textarea
            name="body"
            placeholder="What's on your mind?"
            required
            minlength="1"
            maxlength="500"
            class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700 min-h-[100px]"
          ></textarea>
          <input 
            name="mediaUrl" 
            placeholder="Media URL" 
            class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700"
          />
          <input 
            name="mediaAlt" 
            placeholder="Media description (Optional)" 
            class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700"
          />
          <div class="flex justify-between">
            <a 
              href="/feed" 
              class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors"
            >
              Cancel
            </a>
            <button
              type="submit"
              class="px-6 py-2 bg-purple-700 text-white rounded-lg hover:bg-purple-600 transition-colors"
            >
              Update
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer class="bg-gray-70 border-t border-gray-200 py-7 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col items-center space-y-4">
          <div class="text-gray-400 text-sm">
            <span class="font-medium">Loop</span> &copy; 2024
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
