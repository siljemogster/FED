<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Post | Loop</title>
    <link rel="stylesheet" href="../css/output.css" />
    <script src="/js/app.js" type="module"></script>
    <style>
      .hidden {
        display: none !important;
      }
      @media (max-width: 640px) {
        main {
          padding-left: 1rem;
          padding-right: 1rem;
        }
        input,
        textarea {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="flex flex-col min-h-screen">
    <header>
      <nav class="bg-white border-b border-gray-200 fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16 items-center">
            <div class="flex-shrink-0 flex items-center">
              <a
                href="/"
                class="text-2xl font-bold tracking-tight text-purple-700 transition-colors"
              >
                Loop
              </a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="max-w-2xl mx-auto p-4 mt-20 flex-grow">
      <div class="bg-white p-6 rounded-lg shadow-sm">
        <h1 class="text-2xl font-bold mb-6">Edit Post</h1>
      </div>
    </main>
    <footer class="bg-white border-t border-gray-200 py-7 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col items-center space-y-4">
          <div class="text-gray-400 text-sm">
            <span class="font-medium">Loop</span> &copy; 2025
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
