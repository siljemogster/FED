<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed Page | Loop</title>
    <link rel="stylesheet" href="/css/output.css" />
    <script src="/js/app.js" type="module"></script>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/favicons/site.webmanifest" />
  </head>
  <body>
    <header>
      <nav class="bg-white border-b border-gray-200 fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16">
            <div class="flex-shrink-0 flex items-center">
              <a
                href="/"
                class="text-2xl font-bold tracking-tight text-purple-700 transition-colors"
              >
                Loop
              </a>
            </div>
            <div class="hidden sm:flex sm:items-center sm:space-x-8">
              <a
                href="/profile"
                class="text-gray-700 hover:text-purple-700 px-3 py-2 text-sm font-medium transition-colors"
              >
                Profile
              </a>
              <a href="/feed" class="text-purple-700 text-sm font-medium">
                Feed
              </a>
              <button
                href="/"
                class="text-gray-700 hover:text-purple-700 px-3 py-2 text-sm font-medium transition-colors"
              >
                Sign Out
              </button>
            </div>
            <div class="flex items-center sm:hidden">
              <button
                type="button"
                class="inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-purple-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-purple-500"
                aria-controls="mobile-menu"
                aria-expanded="false"
                onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
              >
                <span class="sr-only">Open main menu</span>
                <svg
                  class="block h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="hidden sm:hidden" id="mobile-menu">
          <div class="pt-10 pb-6 space-y-3">
            <a
              href="/profile"
              class="text-gray-700 hover:text-purple-700 hover:bg-gray-50 block px-6 py-6 text-base font-medium transition-colors"
            >
              Profile
            </a>
            <a
              href="/feed"
              class="text-purple-700 hover:bg-gray-50 block px-6 py-6 text-base font-medium transition-colors"
            >
              Feed
            </a>
            <button
              href="/"
              class="text-gray-700 hover:text-purple-700 hover:bg-gray-50 block px-6 py-6 text-base font-medium transition-colors"
            >
              Sign Out
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section>
        <div class="h-16 bg-gray-500"></div>
        <h1
          class="mt-16 text-center text-4xl font-bold tracking-tight text-purple-700"
        >
          Stay in the Loop
        </h1>
        <p class="mt-1.5 mb-8 text-center tracking-tight text-gray-900">
          a community for creative thinkers
        </p>
      </section>
      <section>
        <div class="max-w-2xl mx-auto p-4 space-y-6">
          <div class="bg-white p-6 rounded-lg shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Create New Post</h2>
            <form class="space-y-4" id="postForm">
              <input name="title" placeholder="title" required />
              <textarea
                name="body"
                placeholder="What's on your mind?"
                required
                minlength="1"
                maxlength="500"
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700 min-h-[100px]"
              ></textarea>
              <input name="mediaUrl" placeholder="media URL" />
              <input name="mediaAlt" placeholder="media alt" />
              <div class="flex flex-wrap gap-4">
                <button
                  type="submit"
                  class="ml-auto px-6 py-2 bg-purple-700 text-white rounded-lg hover:bg-purple-600"
                >
                  Post
                </button>
              </div>
            </form>
          </div>
          <div
            class="flex items-center justify-between gap-2 w-full bg-white p-4 rounded-lg shadow-sm"
          >
            <div class="relative flex-grow">
              <div class="flex">
                <input
                  type="search"
                  placeholder="Search posts..."
                  id="search-input"
                  class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700"
                />
                <i
                  class="fas fa-search absolute left-3 top-2.5 text-gray-400"
                ></i>
                <button id="search-button">Search</button>
              </div>
            </div>
            <input id="name-filter" placeholder="Filter by name" />
            <!-- <select
              class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 bg-white"
            >
              <option value="recent">Most Recent</option>
              <option value="popular">Most Popular</option>
              <option value="comments">Most Commented</option>
            </select> -->
          </div>
        </div>
        <div id="display-container"></div>
      </section>
    </main>
    <footer>
      <div class="bg-gray-70 border-t border-gray-200 py-7 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex flex-col items-center space-y-4">
            <div class="text-gray-400 text-sm">
              <span class="font-medium">Loop</span> &copy; 2024
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
