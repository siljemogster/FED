<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Loop</title>
    <link rel="stylesheet" href="/css/output.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/favicons/site.webmanifest" />
    <script src="/js/api/auth/register.js" type="module"></script>
  </head>
  <body>
    <main
      class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8"
    >
      <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h1
          class="mt-6 text-center text-4xl font-bold tracking-tight text-purple-700"
        >
          Loop
        </h1>
        <h2
          class="mt-6 text-center text-2xl font-bold tracking-tight text-gray-900"
        >
          Create your account
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Or
          <button href="/" class="font-medium text-purple-700 hover:text-purple-600">
            Sign in here
          </button>
        </p>
      </div>

      <section class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
          <form id="registerForm" class="space-y-6">
            <div id="message"></div>
            <fieldset class="space-y-6">
              <legend class="sr-only">Fill in your details to register</legend>
              <div>
                <label
                  for="name"
                  class="block text-sm font-medium leading-6 text-gray-900"
                >
                  Name
                </label>
                <div class="mt-2">
                  <input
                    type="text"
                    id="name"
                    name="name"
                    aria-describedby="nameHelp"
                    required autocomplete="name"
                    pattern="[A-Za-z0-9_]+"
                    title="Only letters, numbers and underscores are allowed"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 px-3"
                    placeholder="Your name"
                    value="jkjklklklklklklkl"
                  />
                </div>
              </div>

              <div>
                <label
                  for="email"
                  class="block text-sm font-medium leading-6 text-gray-900"
                >
                  Email
                </label>
                <div class="mt-2">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    pattern="^[^@]+@(stud\.|)(noroff\.no)$"
                    title="Please provide a noroff.no or stud.noroff.no email address"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 px-3"
                    placeholder="yourname@stud.noroff.no"
                    value="jkjklklklklklklkl@stud.noroff.no"
                  />
                </div>
              </div>

              <div>
                <label
                  for="password"
                  class="block text-sm font-medium leading-6 text-gray-900"
                >
                  Password
                </label>
                <div class="mt-2">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 px-3"
                    placeholder="Minimum 8 characters"
                    oninvalid="this.setCustomValidity('Password must be at least 8 characters')"
                    oninput="this.setCustomValidity('')"
                    value="Test12345678"
                  />
                </div>
              </div>

              <div>
                <label
                  for="bio"
                  class="block text-sm font-medium leading-6 text-gray-900"
                >
                  Bio
                </label>
                <div class="mt-2">
                  <textarea
                    id="bio"
                    name="bio"
                    rows="3"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 px-3"
                    placeholder="Tell us about yourself"
                  ></textarea>
                </div>
              </div>

              <div>
                <label
                  for="avatarUrl"
                  class="block text-sm font-medium leading-6 text-gray-900"
                >
                  Avatar URL
                </label>
                <div class="mt-2">
                  <input
                    type="url"
                    id="avatarUrl"
                    name="avatarUrl"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6 px-3"
                    placeholder="https://example.com/avatar.jpg"
                  />
                </div>
              </div>

              <div>
                <button
                  type="submit"
                  class="flex w-full justify-center rounded-md bg-purple-700 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-purple-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
                >
                  Register
                </button>
              </div>
            </fieldset>
          </form>

          <div class="mt-6">
            <div class="relative">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
              </div>
              <div class="relative flex justify-center text-sm">
                <span class="bg-white px-2 text-gray-500"
                  >Already have an account?</span
                >
              </div>
            </div>
            <div class="mt-6">
              <a
                href="/"
                class="flex w-full justify-center rounded-md border border-purple-700 bg-white px-3 py-2 text-sm font-semibold text-purple-600 shadow-sm hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-600"
              >
                Sign in here
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-gray-70 border-t border-gray-200 py-7 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col items-center space-y-4">
          <div class="text-gray-400 text-sm">
            <span class="font-medium">Loop</span> &copy; 2024
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
